<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ParaziTR - Terminal</title>
    <style>
        body {
            background-color: #050505;
            color: #00ff66;
            font-family: monospace;
            text-align: center;
            padding: 20px;
        }
        .terminal-box {
            border: 1px solid #00ff66;
            padding: 20px;
            margin: 20px auto;
            max-width: 400px;
            background: #000;
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.2);
        }
        audio {
            width: 100%;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <h2>ParaziTR [ Terminal Radyo ]</h2>

    <div class="terminal-box">
        <h3 id="song-title" style="margin-bottom: 5px;">Sistem Yükleniyor...</h3>
        <p id="song-artist" style="color: #888; margin-top: 0;">--</p>
        
        <audio id="audio-player" controls preload="auto"></audio>
    </div>

    <script>
        fetch('playlist.json?v=' + new Date().getTime())
            .then(response => response.json())
            .then(songs => {
                let currentIndex = 0;
                const player = document.getElementById('audio-player');
                const title = document.getElementById('song-title');
                const artist = document.getElementById('song-artist');

                function loadSong(index) {
                    title.innerText = songs[index].title;
                    artist.innerText = songs[index].artist;
                    player.src = songs[index].url;
                    player.load();
                }

                player.onerror = () => {
                    title.innerText = "❌ Dosya Bulunamadı!";
                    artist.innerText = songs[currentIndex].url;
                };

                player.onended = () => {
                    currentIndex = (currentIndex + 1) % songs.length;
                    loadSong(currentIndex);
                    player.play();
                };

                if(songs.length > 0) {
                    loadSong(currentIndex);
                }
            })
            .catch(err => {
                document.getElementById('song-title').innerText = "❌ playlist.json Okunamadı!";
            });
    </script>

</body>
</html>
