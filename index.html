<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PARAZITR 1.0</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }
        body {
            background-color: #050805;
            color: #2ecc71;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .header {
            text-align: center;
            margin-bottom: 25px;
            font-size: 1.4rem;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(46, 204, 113, 0.6);
        }
        .menu-list {
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .menu-btn {
            background-color: #0b140b;
            border: 1px solid #2ecc71;
            color: #2ecc71;
            padding: 15px 20px;
            text-align: left;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 4px;
            text-decoration: none;
            box-shadow: 0 0 5px rgba(46, 204, 113, 0.2);
            transition: all 0.2s ease;
        }
        .menu-btn:active {
            background-color: #2ecc71;
            color: #050805;
        }
        .sub-panel {
            display: none;
            background-color: #080f08;
            border: 1px dashed #2ecc71;
            padding: 15px;
            margin-top: -10px;
            margin-bottom: 5px;
            border-radius: 4px;
        }
        .player-box {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        audio {
            width: 100%;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="header">
        ☢️ PARAZITR 1.0 ☢️
    </div>

    <div class="menu-list">
        
        <!-- 1. Müzik Bölümü -->
        <button class="menu-btn" onclick="toggleSection('music-panel')">
            <span>> MUSIC [ ENES ALPER - SAKAT BIRAKIRIM ]</span>
            <span>🎵</span>
        </button>
        
        <div id="music-panel" class="sub-panel">
            <div class="player-box">
                <div style="font-size: 0.85rem; font-weight: bold; color: #2ecc71;">Sistem Yükleniyor...</div>
                <div style="font-size: 0.75rem; color: #27ae60;">Enes Alper - Sakat Bırakırım</div>
              
                    </audio>
    <audio id="audio-player" controls preload="auto" src="./sarki.mp3">
    </audio>


            </div>
        </div>

        <!-- 2. APK İndirme Butonu (Sorunsuz Çalışan) -->
        <a href="./ParaziTR_1.apk" class="menu-btn" download="ParaziTR_1.apk">
            <span>> DOWNLOAD APP (.APK)</span>
            <span>📥</span>
        </a>

        <!-- 3. Xbox / Sistem Bilgi -->
        <div class="menu-btn">
            <span>> ParaziTR Çevrimiçi </span>
            <span>🟢</span>
        </div>

        <!-- 4. Ayarlar -->
        <div class="menu-btn">
            <span>> SETTINGS // ABOUT</span>
            <span>⚙️</span>
        </div>

    </div>

    <script>
        function toggleSection(id) {
            var panel = document.getElementById(id);
            if (panel.style.display === "block") {
                panel.style.display = "none";
            } else {
                panel.style.display = "block";
            }
        }
    </script>

</body>
</html>
