<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PARAZITR 1.0</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }
        body {
            background-color: #050805;
            color: #2ecc71;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .header {
            text-align: center;
            margin-bottom: 25px;
            font-size: 1.4rem;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(46, 204, 113, 0.6);
        }
        .menu-list {
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .menu-btn {
            background-color: #0b140b;
            border: 1px solid #2ecc71;
            color: #2ecc71;
            padding: 15px 20px;
            text-align: left;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 4px;
            text-decoration: none;
            box-shadow: 0 0 5px rgba(46, 204, 113, 0.2);
            transition: all 0.2s ease;
        }
        .menu-btn:active {
            background-color: #2ecc71;
            color: #050805;
        }
        .sub-panel {
            display: none;
            background-color: #080f08;
            border: 1px dashed #2ecc71;
            padding: 15px;
            margin-top: -10px;
            margin-bottom: 5px;
            border-radius: 4px;
        }
        .player-box {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .song-btn {
            background-color: #0d1a0d;
            border: 1px solid #27ae60;
            color: #2ecc71;
            padding: 10px;
            text-align: left;
            font-size: 0.8rem;
            border-radius: 3px;
            cursor: pointer;
        }
        .song-btn:hover, .song-btn:active {
            background-color: #2ecc71;
            color: #000;
        }
    </style>
</head>
<body>

    <div class="header">
        ☢️ PARAZITR 1.0 ☢️
    </div>

    <div class="menu-list">
        
        <!-- Müzik Paneli -->
        <button class="menu-btn" onclick="toggleSection('music-panel')">
            <span>> MUSIC [ ENES ALPER - PLAYLIST ]</span>
            <span>🎵</span>
        </button>
        
        <div id="music-panel" class="sub-panel">
            <div class="player-box">
                <div style="font-size: 0.85rem; font-weight: bold; color: #2ecc71;">ParaziTR Müzik Çalar</div>
                <div id="now-playing" style="font-size: 0.75rem; color: #27ae60;">Şarkı Seçin</div>
                
                <audio id="audio-player" controls preload="auto" src="./Enes-alper-8.mp3" style="width:100%; margin: 5px 0;"></audio>

                <!-- 1'den 8'e Şarkı Listesi -->
                <div style="display: flex; flex-direction: column; gap: 6px; max-height: 200px; overflow-y: auto;">
                    <button onclick="changeSong('./Enes-alper-8.mp3', 'Enes Alper - Sakat Bırakırım 8')" class="song-btn">▶ 1. Enes Alper - Sakat Bırakırım 8</button>
                    <button onclick="changeSong('./Enes-alper-7.mp3', 'Enes Alper - Sakat Bırakırım 7')" class="song-btn">▶ 2. Enes Alper - Sakat Bırakırım 7</button>
                    <button onclick="changeSong('./Enes-alper-6.mp3', 'Enes Alper - Sakat Bırakırım 6')" class="song-btn">▶ 3. Enes Alper - Sakat Bırakırım 6</button>
                    <button onclick="changeSong('./Enes-alper-5.mp3', 'Enes Alper - Sakat Bırakırım 5')" class="song-btn">▶ 4. Enes Alper - Sakat Bırakırım 5</button>
                    <button onclick="changeSong('./Sakat-Bırakırım-4.mp3', 'Enes Alper - Sakat Bırakırım 4')" class="song-btn">▶ 5. Enes Alper - Sakat Bırakırım 4</button>
                    <button onclick="changeSong('./Sakat-Bırakırım-3.mp3', 'Enes Alper - Sakat Bırakırım 3')" class="song-btn">▶ 6. Enes Alper - Sakat Bırakırım 3</button>
                    <button onclick="changeSong('./Sakat-Bırakırım-2.mp3', 'Enes Alper - Sakat Bırakırım 2')" class="song-btn">▶ 7. Enes Alper - Sakat Bırakırım 2</button>
                    <button onclick="changeSong('./Sakat-Bırakırım-1.mp3', 'Enes Alper - Sakat Bırakırım 1')" class="song-btn">▶ 8. Enes Alper - Sakat Bırakırım 1</button>
                </div>
            </div>
        </div>

        <!-- APK İndirme Butonu -->
        <a href="./ParaziTR_1.apk" class="menu-btn" download="ParaziTR_1.apk">
            <span>> DOWNLOAD APP (.APK)</span>
            <span>📥</span>
        </a>

        <!-- Sistem Bilgisi -->
        <div class="menu-btn">
            <span>> ParaziTR Çevrimiçi</span>
            <span>🟢</span>
        </div>

        <!-- Ayarlar -->
        <div class="menu-btn">
            <span>> SETTINGS // ABOUT</span>
            <span>⚙️</span>
        </div>

    </div>

    <script>
        function toggleSection(id) {
            var panel = document.getElementById(id);
            panel.style.display = (panel.style.display === "block") ? "none" : "block";
        }
        function changeSong(songSrc, title) {
            var player = document.getElementById('audio-player');
            var nowPlaying = document.getElementById('now-playing');
            player.src = songSrc;
            nowPlaying.innerText = title;
            player.play();
        }
    </script>

</body>
</html>
