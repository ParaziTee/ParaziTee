<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ParaziTR - Terminal Radyo</title>
    <style>
        body {
            background-color: #050505;
            color: #ffcc00;
            font-family: monospace;
            text-align: center;
            padding: 15px;
            margin: 0;
        }
        h2 {
            color: #ffcc00;
            text-shadow: 0 0 8px rgba(255, 204, 0, 0.4);
            font-size: 1.2rem;
        }
        .terminal-box {
            border: 1px solid #ffcc00;
            padding: 15px;
            margin: 10px auto;
            max-width: 420px;
            background: #000;
            box-shadow: 0 0 10px rgba(255, 204, 0, 0.2);
        }
        audio {
            width: 100%;
            margin-top: 10px;
        }
        .controls-box {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            gap: 5px;
        }
        .btn-term {
            background: #050505;
            color: #ffcc00;
            border: 1px solid #ffcc00;
            padding: 8px 10px;
            font-family: monospace;
            font-weight: bold;
            cursor: pointer;
            flex: 1;
            font-size: 0.85rem;
        }
        .btn-term:hover, .btn-term:active {
            background: #ffcc00;
            color: #000;
        }

        /* Klasör / Dizin Alanı Stilleri */
        .folder-container {
            border: 1px solid #ffcc00;
            margin: 15px auto;
            max-width: 420px;
            background: #000;
            text-align: left;
            box-shadow: 0 0 10px rgba(255, 204, 0, 0.2);
        }
        .folder-header {
            background: #111;
            color: #ffcc00;
            padding: 10px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .folder-header:hover {
            background: #222;
        }
        .folder-content {
            display: none; /* Başlangıçta kapalı durur */
            padding: 5px 0;
            background: #050505;
        }
        .folder-content.open {
            display: block; /* Tıklanınca açılır */
        }
        .track-item {
            padding: 8px 15px;
            cursor: pointer;
            border-bottom: 1px dashed #222;
            font-size: 0.8rem;
            color: #aaa;
            transition: 0.1s;
        }
        .track-item:hover {
            background: #151500;
            color: #ffcc00;
        }
        .track-item.active {
            color: #ffcc00;
            background: #221a00;
            border-left: 3px solid #ffcc00;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>ParaziTR [ Terminal Radyo ]</h2>

    <!-- Ana Oynatıcı Paneli -->
    <div class="terminal-box">
        <h3 id="song-title" style="margin-bottom: 3px; font-size: 1rem;">Sistem Yükleniyor...</h3>
        <p id="song-artist" style="color: #888; margin-top: 0; font-size: 0.8rem;">--</p>
        
        <audio id="audio-player" controls preload="auto"></audio>

        <!-- Kontrol Butonları -->
        <div class="controls-box">
            <button class="btn-term" onclick="prevSong()">[ &lt;&lt; GERİ ]</button>
            <button class="btn-term" onclick="replaySong()">[ ↻ TEKRAR ]</button
