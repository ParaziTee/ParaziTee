<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PARAZITR 1.0</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
        body { background-color: #050805; color: #2ecc71; padding: 15px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        .top-bar { width: 100%; max-width: 450px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .header { font-size: 1.4rem; font-weight: bold; text-shadow: 0 0 10px rgba(46, 204, 113, 0.6); }
        
        /* Yan Menü Butonu */
        .menu-toggle-btn { background: #0b140b; border: 1px solid #2ecc71; color: #2ecc71; padding: 8px 12px; cursor: pointer; font-size: 1rem; border-radius: 4px; }
        .menu-toggle-btn:active { background: #2ecc71; color: #050805; }

        /* Yan Panel (Sidebar) */
        .side-panel {
            position: fixed; top: 0; right: -300px; width: 300px; height: 100%;
            background-color: #080f08; border-left: 1px solid #2ecc71; box-shadow: -5px 0 15px rgba(0,0,0,0.8);
            transition: right 0.3s ease; z-index: 1000; padding: 20px; display: flex; flex-direction: column; gap: 15px; overflow-y: auto;
        }
        .side-panel.open { right: 0; }
        .close-btn { background: none; border: 1px solid #e74c3c; color: #e74c3c; padding: 5px; cursor: pointer; text-align: center; font-weight: bold; border-radius: 3px; }
